name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [LaciMoney, LaciPrint, LaciCore]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --package-path Packages/${{ matrix.package }}
      - run: swift test --package-path Packages/${{ matrix.package }}

  money-imports:
    name: LaciMoney imports only Foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-money-imports.sh

  print-imports:
    name: LaciPrint imports only Foundation, CoreGraphics and LaciMoney
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-print-imports.sh

  lint:
    name: SwiftLint + SwiftFormat
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint version && swiftformat --version
      - run: swiftformat --lint .
      - run: swiftlint lint --strict

  app:
    # Both device families: the iPhone layout, and the iPad where the three panes and the AX3
    # collapse are asserted (SPEC §9).
    name: xcodebuild test (${{ matrix.device }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 17
            slug: iphone17
          - device: iPad Pro 11-inch (M5)
            slug: ipadpro11
    env:
      DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=26.5
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcrun simctl list devices available
      # A cold simulator on the runner has timed out the first XCUITest launch (60 s); booting it
      # while the build runs keeps that launch inside the limit.
      - name: Boot the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg name "${{ matrix.device }}" \
                '.devices | to_entries[] | select(.key | endswith("iOS-26-5")) | .value[]
                 | select(.name == $name) | .udid' | head -1)
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Laci.xcodeproj -scheme Laci \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Test without building
        run: |
          xcodebuild test-without-building \
            -project Laci.xcodeproj -scheme Laci \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults-${{ matrix.slug }}.xcresult
          path: build/TestResults.xcresult
