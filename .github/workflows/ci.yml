name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same matrix before it ships, so the two can never disagree.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  packages:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [LaciMoney, LaciPrint, LaciCore]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --package-path Packages/${{ matrix.package }}
      - run: swift test --package-path Packages/${{ matrix.package }}

  money-imports:
    name: LaciMoney imports only Foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-money-imports.sh

  print-imports:
    name: LaciPrint imports only Foundation, CoreGraphics and LaciMoney
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-print-imports.sh

  crash-reporting:
    name: Crashlytics boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-crash-reporting.sh

  required-reason-apis:
    name: Privacy manifest declares every required-reason API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/assert-required-reason-apis.sh

  lint:
    name: SwiftLint + SwiftFormat
    runs-on: macos-26
    env:
      # Pinned, not the latest: this job gates the release, so a new rule must not block a tag with
      # no code change. To bump, change a version and its checksum and run it locally first.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      SWIFTFORMAT_VERSION: 0.64.5
      SWIFTFORMAT_SHA256: ec017c91fdd46233e5a22dc43ff9564a3cc4b37023d3b4681b6c7d7b781de113
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned SwiftLint
        run: |
          mkdir -p "$RUNNER_TEMP/swiftlint"
          cd "$RUNNER_TEMP/swiftlint"
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  swiftlint.zip" | shasum -a 256 --check
          unzip -q swiftlint.zip
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install the pinned SwiftFormat
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat"
          cd "$RUNNER_TEMP/swiftformat"
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  swiftformat.zip" | shasum -a 256 --check
          unzip -q swiftformat.zip
          echo "$PWD" >> "$GITHUB_PATH"
      - run: test "$(swiftlint version)" = "$SWIFTLINT_VERSION"
      - run: test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION"
      - run: swiftformat --lint .
      - run: swiftlint lint --strict

  app:
    # Both device families: the iPhone layout, and the iPad where the three panes and the AX3
    # collapse are asserted (SPEC §9).
    name: xcodebuild test (${{ matrix.device }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 17
            slug: iphone17
          - device: iPad Pro 11-inch (M5)
            slug: ipadpro11
    env:
      DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=26.5
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcrun simctl list devices available
      # A cold simulator on the runner has timed out the first XCUITest launch (60 s); booting it
      # while the build runs keeps that launch inside the limit.
      - name: Boot the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg name "${{ matrix.device }}" \
                '.devices | to_entries[] | select(.key | endswith("iOS-26-5")) | .value[]
                 | select(.name == $name) | .udid' | head -1)
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Laci.xcodeproj -scheme Laci \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Test without building
        run: |
          xcodebuild test-without-building \
            -project Laci.xcodeproj -scheme Laci \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath build/TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults-${{ matrix.slug }}.xcresult
          path: build/TestResults.xcresult
